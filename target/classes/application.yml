spring:
  datasource:
    url: jdbc:mysql://localhost:3306/form_manager?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: form_user
    password: form_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  thymeleaf:
    cache: false

server:
  port: 8080
