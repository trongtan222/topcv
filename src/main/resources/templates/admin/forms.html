<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Admin - Forms</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 24px;
      }
      .error {
        background: #ffe3e3;
        border: 1px solid #ffb3b3;
        color: #8a1f1f;
        padding: 10px;
        margin: 12px 0;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
      }
      th {
        background: #f2f2f2;
        text-align: left;
      }
      a,
      button {
        margin-right: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Admin - Forms</h1>
    <div th:if="${param.error}" class="error" th:text="${param.error}"></div>
    <p><a href="/admin/forms/new">Create new form</a></p>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Status</th>
          <th>Order</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="form : ${forms}">
          <td th:text="${form.id}"></td>
          <td th:text="${form.title}"></td>
          <td th:text="${form.status}"></td>
          <td th:text="${form.displayOrder}"></td>
          <td>
            <a th:href="@{/admin/forms/{id}/edit(id=${form.id})}">Edit</a>
            <form
              th:action="@{/admin/forms/{id}/delete(id=${form.id})}"
              method="post"
              style="display: inline"
            >
              <button type="submit">Delete</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
